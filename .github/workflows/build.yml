name: Build ClipRec

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -o cliprec-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        working-directory: cliprec
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cliprec-jar
          path: |
            cliprec/build/libs/*.jar
            !cliprec/build/libs/*-sources.jar
